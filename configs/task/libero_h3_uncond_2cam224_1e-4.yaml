# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: fastwam_h3
  - _self_

# Keep the original 32-step action horizon, but sample five visual frames.
# H3 uses the 17k+5 frame family; five is the smallest valid uncond smoke-test
# length and gives four transitions with eight actions per transition.
data:
  train:
    action_video_freq_ratio: 8
    # H3 Qwen3-VL consumes f0 and instruction together; Wan/T5 text-only
    # embeddings are not compatible with this conditioning path.
    text_embedding_cache_dir: null
    h3_condition_cache_dir: ./data/h3_condition_cache/libero_2cam224
    skip_padding_as_possible: true
    max_padding_retry: 50

# B=1 without mixed-attention activation checkpointing is the fastest stable
# 8xH20 setting. B=2 reaches roughly 96 GiB/device and is too close to OOM.
batch_size: 2
num_workers: 4

model:
  # Training reads exact Qwen layer-50 f0+instruction rows from the native
  # cache so the 32B encoder and H3 Video Expert never share one GPU.
  load_text_encoder: false
  # Sustained 8xH20 benchmark: 1.67 samples/s without checkpointing versus
  # 1.51 samples/s with checkpointing. B=1 retains safe memory headroom.
  mot_checkpoint_mixed_attn: false
  # The 32 action rows cover the four transitions of five visual frames.
  # On H3's native 24-fps RoPE clock, eight controls per visual interval
  # therefore correspond to an effective action rate of 24 * 8 = 192.
  action_fps: 192.0

lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 10
# EXPERIMENT_37 defines the budget as optimizer steps; this intentionally
# overrides num_epochs and corresponds to about 46.1 dataset traversals.
max_steps: 100000
log_every: 10
save_every: 10000
# A full ZeRO-2 state is about 166 GiB. Retain only the newest two states and
# weights so the cache plus checkpoints stay within the local 2.5 TiB budget.
max_checkpoints: 2
# Full-video and action flow-matching losses are both active in Scheme A.
eval_every: 0

# 1 sample/GPU x 8 GPUs x 16 accumulation steps keeps global batch 128.
gradient_accumulation_steps: 8
weight_decay: 1.0e-2
# Action-only H3 checkpoints use the incompatible pre-Scheme-A schema.
resume: null
initial_step: 0

swanlab:
  enabled: true
  project: fastwam-h3
  experiment_name: experiment-37-libero
  mode: online
