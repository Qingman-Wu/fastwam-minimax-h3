# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: fastwam_h3
  - _self_

# Keep the original 32-step action horizon, but sample five visual frames.
# H3 uses the 17k+5 frame family; five is the smallest valid uncond smoke-test
# length and gives four transitions with eight actions per transition.
data:
  train:
    action_video_freq_ratio: 8
    # H3 Qwen3-VL consumes f0 and instruction together; Wan/T5 text-only
    # embeddings are not compatible with this conditioning path.
    text_embedding_cache_dir: null
    skip_padding_as_possible: true
    max_padding_retry: 50

batch_size: 16
num_workers: 16

model:
  # The optimized 8xH20 setting has enough memory to avoid recomputation.
  mot_checkpoint_mixed_attn: false
  # The 32 action rows cover the four transitions of five visual frames.
  # On H3's native 24-fps RoPE clock, eight controls per visual interval
  # therefore correspond to an effective action rate of 24 * 8 = 192.
  action_fps: 192.0

lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 10
max_steps: 100000
log_every: 10
save_every: 10000
# Full-video and action flow-matching losses are both active in Scheme A.
eval_every: 0

# 16 samples/GPU x 8 GPUs keeps the original effective global batch at 128.
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
# Action-only H3 checkpoints use the incompatible pre-Scheme-A schema.
resume: null
initial_step: 0

swanlab:
  enabled: true
  project: fastwam-h3
  experiment_name: experiment-37-libero
  mode: online
