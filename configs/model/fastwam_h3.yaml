_target_: fastwam.runtime.create_fastwam_h3
model_path: /root/wuqingman/models/MiniMax-H3/FL2VA
load_text_encoder: true
# For live inference, place Qwen on a different >=64GB GPU from the H3 Video
# Expert. Scheme-A training overrides load_text_encoder=false and uses cache.
text_encoder_device: null
proprio_dim: ${data.train.processor.proprio_output_dim}
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/H3ActionDiT_video_interp_1024hdim.pt
skip_dit_load_from_pretrain: false
keyframe_condition_strength: 0.999
video_fps: 24.0
action_fps: 8.0
freeze_video_expert: true

# Full MiniMax H3 FL2VA video expert. These values are checked against
# FL2VA/transformer/config.json at load time.
video_dit_config:
  hidden_size: 5376
  ffn_hidden_size: 14336
  num_layers: 50
  num_attention_heads: 56
  attention_head_dim: 128
  latents_dim: 24
  patch_size: [1, 2, 2]
  text_dim: 5120
  timestep_input_dim: 256
  time_embed_hidden_size: 5376
  time_embed_dim: 2688
  rope_inv_freq_len: 16
  norm_eps: 1.0e-05
  qk_norm_eps: 1.0e-05
  final_norm_eps: 1.0e-05
  video_attention_mask_mode: "bidirectional"

# Independent width-reduced Action Expert. Its input is exactly one current-state
# condition token followed by noisy action target tokens.
# Layer count and attention geometry stay identical to the video expert so
# their Q/K/V tensors can participate in the same MoT attention operation.
action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  state_dim: ${data.train.processor.proprio_output_dim}
  hidden_size: 1024
  ffn_hidden_size: 4096
  num_layers: 50
  num_attention_heads: 56
  attention_head_dim: 128
  timestep_input_dim: 256
  time_embed_hidden_size: 1024
  time_embed_dim: 1024
  rope_inv_freq_len: 16
  norm_eps: 1.0e-05
  qk_norm_eps: 1.0e-05
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

# H3's released scheduler uses a substantially larger video shift than Wan.
video_scheduler:
  train_shift: 12.0
  infer_shift: 12.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  # Scheme A predicts and supervises every full-video latent, including z0.
  lambda_video: 1.0
  lambda_action: 1.0
